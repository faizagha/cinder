spring:
  application:
    name: note-service

  datasource:
    url: jdbc:postgresql://localhost:5432/cinderdb
    driver-class-name: org.postgresql.Driver
    username: faizagha
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

cinder:
  cors:
    allowed-origins: http://localhost:8000,http://localhost:3000,http://localhost:5173
  rate-limit:
    capacity: 60
    refill-rate: 1.0
    bucket-ttl-ms: 3600000
    salt-rotation-ms: 3600000

  admin:
    token: ${CINDER_ADMIN_TOKEN:}

logging:
  level:
    root: INFO
    dev.cinder: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
